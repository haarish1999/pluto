---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpro-mc-dep
  labels:
    app: vpro-mc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpro-mc
  template:
    metadata:
      labels:
        app: vpro-mc
    spec:
      containers:
      - name: vpro-mc
        image: memcached
        ports:
        - containerPort: 11211
          name: vpro-mc-port

